<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pairs: loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root,:root[data-theme="dark"],:root[data-theme="light"]{
  --table:#141C45;--back:#2D3C9B;--dot:#4A5BC4;--paper:#F2EEE3;--ink:#141C45;--muted:#9AA3D6;--line:rgba(242,238,227,.14);--gold:#F5B700;--red:#F2542D;
  --ease:cubic-bezier(.16,1,.3,1);--font:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;display:grid;place-items:center;background:var(--table) radial-gradient(rgba(242,238,227,.07) 1.2px,transparent 1.4px) 0 0/18px 18px;color:var(--paper);font-family:var(--font);padding:20px}
main{display:grid;justify-items:center;gap:1.5rem;text-align:center}
.lgrid{display:grid;grid-template-columns:repeat(2,clamp(72px,18vw,110px));gap:14px}
.lc{aspect-ratio:4/5;perspective:500px}
.lc i{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:flip 2.4s var(--ease) infinite;animation-delay:var(--d)}
.lc b,.lc u{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-decoration:none}
.lc b{background:var(--back) radial-gradient(var(--dot) 1.4px,transparent 1.8px) 0 0/10px 10px;box-shadow:inset 0 0 0 3px rgba(242,238,227,.12)}
.lc u{transform:rotateY(180deg);background:var(--paper);display:grid;place-items:center}
.lc u svg{width:66%;height:auto}
@keyframes flip{0%,22%{transform:rotateY(0)}40%,68%{transform:rotateY(180deg)}86%,100%{transform:rotateY(360deg)}}
h1{font-size:clamp(3.4rem,14vw,6rem);font-weight:800;letter-spacing:-.05em;line-height:.9;margin:.3rem 0 0;font-variation-settings:"opsz" 96}
.bar{width:min(240px,60vw);height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;width:100%;border-radius:4px;background:var(--gold);transform:scaleX(0);transform-origin:left;animation:fill 2.4s var(--ease) forwards}
@keyframes fill{to{transform:scaleX(1)}}
.msg{margin:0;color:var(--muted);min-height:1.5em}
.open{display:inline-block;text-decoration:none;background:var(--red);color:var(--ink);font-weight:750;font-size:1.15rem;padding:.95rem 1.8rem;border-radius:16px;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .5s var(--ease),transform .5s var(--ease)}
.open.show{opacity:1;transform:none;pointer-events:auto}
.open:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.lc i{animation:none}.bar span{animation:none;transform:none}}
</style>
</head>
<body>
<main role="status" aria-live="polite">
  <div class="lgrid" aria-hidden="true"><div class="lc"><i style="--d:0.0s"><b></b><u><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="32" fill="#F2542D"/><circle cx="50" cy="50" r="13" fill="#141C45"/></svg></u></i></div><div class="lc"><i style="--d:0.18s"><b></b><u><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 10 62 37 91 41 70 61 75 90 50 76 25 90 30 61 9 41 38 37Z" fill="#F5B700"/><circle cx="50" cy="52" r="8" fill="#F2542D"/></svg></u></i></div><div class="lc"><i style="--d:0.36s"><b></b><u><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="18" y="18" width="64" height="64" rx="8" fill="#2EC4A6"/><rect x="38" y="38" width="24" height="24" fill="#141C45" transform="rotate(45 50 50)"/></svg></u></i></div><div class="lc"><i style="--d:0.54s"><b></b><u><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 90C16 66 8 42 24 26c11-11 24-6 26 5 2-11 15-16 26-5 16 16 8 40-26 64Z" fill="#FF8FB1"/></svg></u></i></div></div>
  <h1>Pairs</h1>
  <div class="bar" aria-hidden="true"><span></span></div>
  <p class="msg" id="msg">Shuffling the deck…</p>
  <a class="open" id="open" href="https://claude.ai/artifact/AU7yduL1TkBSTBhJBNGtG4" target="_top" rel="noopener">Open Pairs</a>
</main>
<script>
setTimeout(function(){
  document.getElementById('msg').textContent='The deck is ready.';
  var o=document.getElementById('open');o.classList.add('show');o.focus({preventScroll:true});
},2500);
</script>
</body>
</html>
